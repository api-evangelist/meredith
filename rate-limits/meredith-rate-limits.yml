name: People Inc / Dotdash Meredith Rate Limits and Bot Policy
description: |
  People Inc does not publish numerical rate limits because it does not run a
  public developer API. The addressable machine-readable surface is rate-
  shaped at the CDN/WAF edge across each brand domain, with per-bot policy
  declarations in /robots.txt. This file documents the observed policy regime
  using the API Commons Rate Limits 0.1 shape.
url: https://raw.githubusercontent.com/api-evangelist/meredith/main/rate-limits/meredith-rate-limits.yml
created: '2026-05-23'
modified: '2026-05-23'
specificationVersion: 'rate-limits-0.1'
providerId: meredith
providerName: People Inc

policies:

  - id: cdn-edge-shaping
    surface: All Brand Domains
    type: edge-rate-shaping
    appliesTo:
      - https://www.people.com
      - https://www.allrecipes.com
      - https://www.investopedia.com
      - https://www.bhg.com
      - https://www.foodandwine.com
      - https://www.realsimple.com
      - https://www.southernliving.com
      - https://www.verywellhealth.com
      - https://www.byrdie.com
      - https://www.travelandleisure.com
      - https://www.eatingwell.com
      - https://www.thespruce.com
      - https://www.simplyrecipes.com
      - https://www.seriouseats.com
      - https://www.health.com
      - https://www.shape.com
      - https://www.brides.com
      - https://www.instyle.com
      - https://www.parents.com
      - https://ew.com
      - https://www.lifewire.com
      - https://www.treehugger.com
      - https://www.tripsavvy.com
      - https://www.thebalancemoney.com
      - https://www.thespruceeats.com
      - https://www.thesprucepets.com
      - https://www.liquor.com
      - https://www.dailypaws.com
      - https://www.marthastewart.com
    observedBehavior:
      defaultUserAgent: |
        Requests with a non-browser User-Agent (e.g. "curl/8.x", "python-
        requests", default tool UAs) receive an immediate HTTP 403 across
        every brand. The WAF appears to enforce this at the edge before
        path-level rules.
      browserUserAgent: |
        Requests with a realistic browser User-Agent succeed at human-pace
        rates. No documented per-IP budget.
      sitemap: |
        /sitemap.xml is consistently served regardless of UA (per RFC
        9309 / sitemaps.org expectations).
      robotsTxt: |
        /robots.txt is always served and is the canonical statement of
        permitted access.

  - id: ai-bot-policy
    surface: All Brand Domains
    type: robots-policy
    appliesToHostsPattern: "*.{brand-domain}"
    rules:
      fullyBlocked:
        - CCBot
        - news-please
        - anthropic-ai
        - ClaudeBot
        - Claude-Web
        - cohere-ai
        - ImagesiftBot
        - FriendlyCrawler
        - Quora-Bot
        - omgilibot
        - omgili
        - PerplexityBot
      partiallyRestricted:
        agents:
          - ChatGPT-User
          - OAI-SearchBot
          - GPTBot
        restriction: "Disallow: /thmb/ (the image-transform / thumbnail subtree)"
      explicitlyAllowed:
        - Pinterest
        - Pinterestbot
    notes: |
      The blocklist is identical across People.com, Allrecipes.com,
      Investopedia.com, BHG.com (and likely every other brand) — strong
      evidence that People Inc maintains a single corporate robots.txt
      template that propagates to all brand domains.

  - id: rss-feed-shaping
    surface: Per-Brand /feed Endpoint
    type: implicit-rate-limit
    appliesTo:
      - https://{brand-domain}/feed
      - https://{brand-domain}/{section}/feed
    observedBehavior: |
      No published rate limit. Requests with a realistic User-Agent at
      human-pace (1 request per second per brand) reliably return RSS
      content. Bursts and bot-class UAs trigger the same edge 403 as the
      site at large.

guidance:
  - audience: Naftiko-class Agents
    recommendation: |
      Honor the per-brand robots.txt. Use the people-inc-rss and people-inc-
      sitemap capabilities (which already set realistic UAs and respect
      bot policy). Avoid bulk crawls.
  - audience: Governance / Rights Management Teams
    recommendation: |
      Use the ai-bot-policy-audit capability to capture a snapshot of the
      AI bot policy across the portfolio on a recurring cadence; flag
      changes to inform internal AI-access agreements.

# ---------------------------------------------------------------------------
# Added 2026-08-12 by the enrichment pipeline — direct observation, replacing
# inference. IMPORTANT CORRECTION to the `rss-feed-shaping` policy above: the
# claim that "requests with a realistic User-Agent at human-pace reliably
# return RSS content" did NOT reproduce this round. Every feed URL in apis.yml
# returned 403 to a single, un-bursted request carrying a genuine desktop
# Chrome user-agent. The edge is fingerprinting the client below the UA layer,
# so pace and UA are not sufficient.
# ---------------------------------------------------------------------------
observedEdgeBehavior:
  probedOn: '2026-08-12'
  publishedNumericLimits: 0
  responseHeaders:
    xRateLimit: absent
    rateLimit: absent
    retryAfter: absent
    note: |
      No rate-limit header of any form was returned on any response, including
      refusals. A client cannot pace itself against a published budget or back
      off on a signal; it can only fail and guess.
  statusesReturned:
    - status: 200
      appliesTo: [/robots.txt, /sitemap.xml, /google-news-sitemap.xml, /.well-known/security.txt]
      note: Allowlisted machine paths, served to every client tested including ClaudeBot.
    - status: 402
      appliesTo: [content paths]
      trigger: declared AI crawler user-agent (observed with ClaudeBot)
      cacheControl: 'private, max-age=0, no-store, no-cache, must-revalidate'
      note: Uncacheable, so the round trip is paid on every attempt.
    - status: 403
      appliesTo: [content paths, RSS feed paths, unallowlisted /.well-known/* paths]
      trigger: any non-browser client, including one sending a desktop Chrome UA
      bodyBytes: 680204-680630
      note: |
        Roughly 680KB of HTML per refusal. Returned identically for real paths
        and fabricated ones, so it carries no existence information.
    - status: 460
      appliesTo: [www.people.inc]
      trigger: Googlebot user-agent from a non-Google IP
      bodyBytes: 10
      note: Unregistered HTTP status code; verified-bot enforcement.
  feedReachability:
    verdict: unreachable-by-machine-clients
    probed:
      - url: https://people.com/feed
        status: 403
      - url: https://people.com/feed/
        status: 403
      - url: https://people.com/rss
        status: 403
      - url: https://www.allrecipes.com/feed
        status: 403
      - url: https://www.investopedia.com/feeds/rss/articles
        status: 403
      - url: https://ew.com/feed
        status: 403
    caveat: |
      The brand homepages return the same 403 to the same client, so this is a
      client-fingerprint refusal and NOT proof the feeds are absent. Recorded
      as unverified in conformance/meredith-conformance.yml rather than as a
      finding that the feeds do not exist.
  sitemapReachability:
    verdict: reachable
    probed:
      - url: https://people.com/sitemap.xml
        status: 200
        detail: sitemapindex, 26 children, lastmod 2026-08-12
      - url: https://people.com/google-news-sitemap.xml
        status: 200
        bytes: 84906
      - url: https://www.allrecipes.com/sitemap.xml
        status: 200
        detail: sitemapindex, 4 children
      - url: https://www.people.inc/sitemap.xml
        status: 200
        detail: urlset, 34 corporate URLs
    recommendation: |
      Sitemaps are the only dependable machine surface. Any recurring
      integration should be built on sitemap <lastmod> polling, not on RSS.
