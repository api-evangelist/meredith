name: people-inc-rss
displayName: People Inc Brand RSS Feeds
description: |
  Shared capability for the per-brand RSS 2.0 feed surface across People Inc
  consumer properties (people.com, allrecipes.com, investopedia.com, bhg.com,
  foodandwine.com, realsimple.com, southernliving.com, byrdie.com, etc.).
  Pulls article-level metadata: title, link, pubDate, description, dc:creator,
  category, media:content. No authentication required; rate-shaped by the
  per-brand edge (Akamai/Cloudflare-class WAF that aggressively 403s
  non-browser user agents — capability MUST set a realistic UA).
version: 0.1.0
owner: api-evangelist
tags:
  - Content
  - RSS
  - Media
  - Publishing
inputs:
  - name: brandDomain
    type: string
    required: true
    description: Brand domain (e.g. people.com, allrecipes.com).
  - name: section
    type: string
    required: false
    description: Optional section path appended to /feed (e.g. /news, /recipes).
outputs:
  - name: items
    type: array
    description: Array of RSS items conforming to json-schema/rss-feed-schema.json.
operations:
  - id: fetchBrandFeed
    method: GET
    pathTemplate: https://{brandDomain}/feed
    headers:
      User-Agent: "Mozilla/5.0 (compatible; Naftiko/1.0; +https://naftiko.com)"
      Accept: "application/rss+xml, application/xml;q=0.9, */*;q=0.8"
    responseSchema: json-schema/rss-feed-schema.json
  - id: fetchSectionFeed
    method: GET
    pathTemplate: https://{brandDomain}/{section}/feed
    headers:
      User-Agent: "Mozilla/5.0 (compatible; Naftiko/1.0; +https://naftiko.com)"
    responseSchema: json-schema/rss-feed-schema.json
policy:
  respectsRobotsTxt: true
  aiBotPolicyAware: true
  notes: |
    Naftiko-class agents reading these feeds for end-user retrieval (humans-in-
    the-loop) are aligned with the spirit of the brand robots.txt; bulk
    crawling for model-training data is explicitly disallowed by every People
    Inc brand. Any capability composition that uses this MUST honor the
    per-brand robots.txt policy and MUST NOT cache for training.
