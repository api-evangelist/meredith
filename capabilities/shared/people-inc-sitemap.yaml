name: people-inc-sitemap
displayName: People Inc Brand Sitemap Discovery
description: |
  Shared capability for traversing the XML sitemap index exposed by each
  People Inc brand domain at /sitemap.xml. Returns the list of child sitemap
  files (typically 1-N section sitemaps) with their lastmod dates, and on
  drill-down returns the URL inventory for any selected child sitemap.
version: 0.1.0
owner: api-evangelist
tags:
  - Sitemaps
  - Discovery
  - Content Inventory
inputs:
  - name: brandDomain
    type: string
    required: true
outputs:
  - name: sitemaps
    type: array
operations:
  - id: fetchSitemapIndex
    method: GET
    pathTemplate: https://{brandDomain}/sitemap.xml
    headers:
      User-Agent: "Mozilla/5.0 (compatible; Naftiko/1.0)"
    responseSchema: json-schema/sitemap-schema.json
  - id: fetchChildSitemap
    method: GET
    pathTemplate: https://{brandDomain}/sitemap_{n}.xml
    headers:
      User-Agent: "Mozilla/5.0 (compatible; Naftiko/1.0)"
    responseSchema: json-schema/sitemap-schema.json
policy:
  respectsRobotsTxt: true
  notes: |
    Sitemaps are explicitly allowed and intended to be machine-readable per
    sitemaps.org. Use them as the canonical inventory rather than scraping
    section pages.
