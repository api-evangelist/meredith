name: ai-bot-policy-audit
displayName: People Inc AI Bot Policy Audit Workflow
description: |
  Composition that fetches robots.txt across the People Inc brand portfolio
  and produces a normalized AI-bot-policy report aligned with the
  json-schema/robots-policy-schema.json structure. Use case: governance teams
  validating that their AI agents respect publisher policy; rights-management
  teams tracking changes to the publisher's AI stance over time.
version: 0.1.0
owner: api-evangelist
tags:
  - Workflow
  - Governance
  - AI Policy
  - Robots
inputs:
  - name: brands
    type: array
    items:
      type: string
    required: true
outputs:
  - name: policies
    type: array
    description: Array of normalized robots-policy objects per brand.
steps:
  - id: fetchPerBrandRobots
    forEach: brands
    do:
      - operation: GET
        pathTemplate: https://{item}/robots.txt
        headers:
          User-Agent: "Mozilla/5.0 (compatible; Naftiko/1.0; governance-audit)"
        responseFormat: text/plain
      - transform: parseRobotsTxt
        outputSchema: json-schema/robots-policy-schema.json
policy:
  respectsRobotsTxt: true
  notes: |
    robots.txt is always fetchable per RFC 9309. This capability is the
    governance counterpart to bulk-content capabilities; agents reading
    People Inc content via RSS/sitemap should consult this audit output
    first.
