description: |
  Lifecycle posture for People Inc. There is no API to version, deprecate or
  put behind an SLA, and the company publishes none of the operational
  transparency surfaces the rating looks for. This file records those
  absences with the probes that established them, so a reader can see they
  were checked rather than skipped.

