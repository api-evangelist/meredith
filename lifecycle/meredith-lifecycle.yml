corporate_lifecycle:
  note: |
    The identity churn is itself a lifecycle hazard for anyone integrating.
    About.com (1997) -> Dotdash (2017) -> Dotdash Meredith (Dec 2021, on the
    $2.7B Meredith acquisition) -> People Inc (July 31, 2025). Artifacts still
    on the wire lag the current name: the live security.txt says "Dotdash",
    and dotdashmeredith.com 301s to www.people.inc. Any consumer hard-coding a
    corporate domain has been broken at least twice.
  redirect_chain_observed:
    - from: https://dotdashmeredith.com/
      status: 301
      to: https://www.dotdashmeredith.com/
    - from: https://www.dotdashmeredith.com/
      status: 301
      to: https://www.people.inc/

