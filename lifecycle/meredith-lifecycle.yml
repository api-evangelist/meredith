changelog:
  url: https://www.people.inc/news-awards
  kind: corporate-press-releases
  api_changelog: false
  detail: |
    apis.yml carries a ChangeLog pointer at the corporate news-and-awards
    page. That page is a press-release and awards listing, NOT a product or
    API changelog — it announces business news, not interface changes. The
    pointer is left in place because it is the only dated update stream the
    company publishes, but no separate changelog/ artifact is authored, and
    a reader should not expect breaking-change notices there.
  fetch_note: |
    The page itself could not be read this round: it returns 403 to browser-UA
    machine clients and 402 Payment Required to declared AI crawlers.

