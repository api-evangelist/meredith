  policy_published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  detail: |
    No deprecation policy is published, and no Sunset or Deprecation response
    header was observed on any probe. NO `Deprecation` pointer is emitted.
  historical_note: |
    Deprecation at People Inc happens at the BRAND level, not the endpoint
    level, and it is not announced in any machine-readable form. Brands in the
    portfolio have been folded or retired over the past several years
    (MyRecipes, for instance, still has a corporate brand page at
    https://www.people.inc/myrecipes listed in the sitemap). A consumer
    tracking these feeds learns a brand is gone by getting a 404, not by
    reading a notice.

