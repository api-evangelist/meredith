  - name: XML Sitemaps Across Properties
    description: |
      Every People Inc brand exposes a discoverable sitemap index at /sitemap.xml
      with per-section sitemap files. These are the canonical machine-readable
      index of all published URLs on each brand. Useful for content auditing,
      compliance, and inventory work — but governed by the robots.txt AI policy.
    humanURL: https://www.allrecipes.com/sitemap.xml
    baseURL: https://www.allrecipes.com/sitemap.xml
    tags:
