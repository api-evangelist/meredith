  - name: D/Cipher Contextual Advertising Platform
    description: |
      D/Cipher is People Inc's proprietary intent-based contextual advertising
      platform — a cookieless targeting solution that derives audience-intent
      signals from how readers engage across People Inc's owned-and-operated
      brand portfolio. Sold as a B2B media buy via the People Inc advertising
      team (no self-serve developer console, no public API). Surfaced via
      the corporate advertising page; integrations with brands run via direct
      IO + branded content rather than a public REST surface.
    humanURL: https://www.people.inc/dcipher
    baseURL: https://www.people.inc/dcipher
    tags:
      - D/Cipher
      - Advertising
      - Contextual
      - AdTech
      - Cookieless
    properties:
      - type: Portal
        url: https://www.people.inc/dcipher
      - type: Contact
        url: mailto:advertising@peopleinc.com
      - type: APIReference
        url: https://www.people.inc/advertising

  - name: Specialty Marketing Solutions (SMS) Suite
    description: |
      A bundle of B2B services run by People Inc with no public developer
      surface but with discrete branded sub-products: Content Solutions
      (content marketing consultancy), Awards & Accolades (licensing of
      editorial-award seals), Targeted Media Health (point-of-care
      advertising), Media Now Interactive (media planning + buying), and
      Content Licensing (content syndication). All transacted via direct sales.
    humanURL: https://www.people.inc/advertising
    baseURL: https://www.people.inc/advertising
    tags:
      - Specialty Marketing Solutions
      - Content Marketing
      - Licensing
      - Point Of Care
    properties:
      - type: Portal
        url: https://www.people.inc/advertising

