description: |
  /.well-known/ discovery probe across the People Inc (formerly Dotdash
  Meredith) brand estate and the corporate people.inc host. One real document
  is served: an RFC 9116 security.txt, byte-identical across every brand
  domain, pointing at a PRIVATE HackerOne program. No OAuth/OIDC discovery,
  no api-catalog, no ai-plugin.json, no A2A agent card is published anywhere
  in the estate — expected, because People Inc runs no authenticated
  developer API.

  IMPORTANT READING NOTE ON THE NON-200 STATUSES BELOW. The People Inc edge
  is Cloudflare with bot management in enforcement mode. Requests for paths
  the edge does not explicitly allowlist are answered 403 with a ~680KB
  interstitial HTML body for EVERY non-browser client, including a real
  Chrome user-agent over curl. A 403 here is therefore NOT proof that the
  path is unimplemented — it is the edge refusing to answer. Only /robots.txt,
  /sitemap.xml, /google-news-sitemap.xml and /.well-known/security.txt are
  served to machine clients. The corporate host additionally answers HTTP
  402 Payment Required to declared AI crawlers (see
  agentic-access/meredith-agentic-access.yml).

